services:
  ravios-dev:
    build:
      context: .
      dockerfile: docker/development/Dockerfile

    container_name: ravios-dev

    working_dir: /workspace

    # Recreating this service container does not remove these named volumes.
    # Do not use `docker compose down -v` for routine container refreshes.
    volumes:
      # Buildroot source
      - buildroot-src:/workspace/buildroot

      # Build output
      - buildroot-output:/workspace/output

      # Download cache
      - buildroot-dl:/workspace/dl

      # Compiler cache
      - buildroot-ccache:/root/.buildroot-ccache

      # RaviOS external configuration and source initializer
      - ./buildroot-external:/workspace/buildroot-external:ro
      - ./docker/development:/workspace/docker/development:ro

      # Final artifacts exported to Windows
      - ./artifacts:/workspace/artifacts

    stdin_open: true
    tty: true

    command: /bin/bash

volumes:
  # Explicit names preserve the existing volumes created by earlier runs.
  # external:true prevents Compose from attempting to manage or recreate them.
  buildroot-src:
    external: true
    name: ravios_buildroot-src
  buildroot-output:
    external: true
    name: ravios_buildroot-output
  buildroot-dl:
    external: true
    name: ravios_buildroot-dl
  buildroot-ccache:
    external: true
    name: ravios_buildroot-ccache
