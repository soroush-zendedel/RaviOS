image efi-part.vfat {
    vfat {
        file EFI {
            image = "efi-part/EFI"
        }

        file bzImage {
            image = "bzImage"
        }
    }

    size = 256M
}

image docker-data.ext4 {
    ext4 {
        use-mke2fs = true
        extraargs = "-U 66666666-6666-6666-6666-666666666666"
        label = "revayat"
    }

    size = DOCKER_DATA_SIZE_PLACEHOLDER
}

image disk.img {
    hdimage {
        partition-table-type = "gpt"
        align = "1M"
    }

    size = DISK_SIZE_PLACEHOLDER

    partition efi {
        image = "efi-part.vfat"
        partition-type-uuid = U
        bootable = true
    }

    partition rootfs {
        partition-type-uuid = L
        partition-uuid = ROOT_PARTUUID
        image = "rootfs.ext2"
    }

    partition docker-data {
        partition-type-uuid = L
        image = "docker-data.ext4"
    }
}
