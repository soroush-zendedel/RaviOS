image efi-part.vfat {
    vfat {
        file EFI {
            image = "efi-part/EFI"
        }

        file bzImage {
            image = "bzImage"
        }
    }

    size = 256M
}

image disk.img {
    hdimage {
        partition-table-type = "gpt"
        align = "1M"
    }

    partition efi {
        image = "efi-part.vfat"
        partition-type-uuid = U
        bootable = true
    }

    partition rootfs {
        partition-type-uuid = L
        partition-uuid = ROOT_PARTUUID
        image = "rootfs.ext2"
    }
}
