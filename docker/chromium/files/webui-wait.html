<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RaviOS — Starting</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --fg: #e8eaed;
      --muted: #9aa0a6;
      --accent: #8ab4f8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
    }
    .card {
      width: min(28rem, 92vw);
      padding: 2rem 1.75rem;
      border-radius: 12px;
      background: #1a1d24;
      border: 1px solid #2a2f3a;
      text-align: center;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.25rem;
      font-weight: 600;
    }
    p {
      margin: 0.35rem 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
    }
    .spinner {
      width: 2.25rem;
      height: 2.25rem;
      margin: 0 auto 1.25rem;
      border: 3px solid #2a2f3a;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status { color: var(--accent); min-height: 1.4em; }
    .hint { font-size: 0.8rem; margin-top: 1.25rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Starting Open WebUI</h1>
    <p id="status">Waiting for the service to become ready…</p>
    <p class="hint">This page retries automatically. You can keep this window open.</p>
  </div>
  <script>
    (function () {
      var target = "http://ravios-webui:8080/";
      var statusEl = document.getElementById("status");
      var attempt = 0;
      var delayMs = 1000;

      function setStatus(text) {
        if (statusEl) statusEl.textContent = text;
      }

      function tryOpen() {
        attempt += 1;
        setStatus("Checking WebUI… (try " + attempt + ")");
        // fetch fails while the service refuses connections; succeeds (opaque) when up.
        fetch(target, { mode: "no-cors", cache: "no-store" })
          .then(function () {
            setStatus("WebUI is ready — opening…");
            window.location.replace(target);
          })
          .catch(function () {
            setStatus("WebUI not ready yet — retrying…");
            setTimeout(tryOpen, delayMs);
            if (delayMs < 4000) delayMs += 250;
          });
      }

      tryOpen();
    })();
  </script>
</body>
</html>
